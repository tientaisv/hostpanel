<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DockPulse - Đăng Nhập Hệ Thống</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .login-card {
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 14px;
      font-size: 1.5rem;
      font-weight: 700;
      justify-content: center;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }
    .form-input {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .form-input:focus {
      border-color: var(--accent-blue);
    }
    .error-msg {
      color: var(--accent-red);
      font-size: 0.85rem;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">⚡</div>
      <div>DockPulse</div>
    </div>
    <div style="text-align: center; color: var(--text-muted); font-size: 0.9rem;">Xác thực tài khoản để truy cập Server Control Hub</div>

    <div class="error-msg" id="error-msg"></div>

    <form id="login-form" class="form-group" style="gap: 16px;">
      <div class="form-group">
        <label class="form-label" for="username">Tên đăng nhập (Username)</label>
        <input type="text" id="username" class="form-input" placeholder="admin" required autofocus>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Mật khẩu (Password)</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required>
      </div>

      <button type="submit" class="btn btn-primary" style="padding: 12px; justify-content: center; margin-top: 8px; font-size: 0.95rem;">🔒 Đăng Nhập</button>
    </form>
  </div>

  <script src="js/login.js"></script>
</body>
</html>
